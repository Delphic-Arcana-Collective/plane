name: Deploy Dashboard (Pages)

on:
  push:
    branches: [preview, main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo run build --filter=web
        env:
          VITE_API_BASE_URL: https://linear.delphic.studio
          VITE_WEB_BASE_URL: https://dashboard.delphic.studio
          VITE_LINEAR_DISPLAY_MODE: "true"
          VITE_LINEAR_WORKSPACE_SLUG: delphic

      # npx from repo root avoids picking up apps/bff/wrangler.toml
      - name: Ensure Pages project exists
        run: npx wrangler@4 pages project create delphic-dashboard --production-branch=preview || true

      - name: Deploy Pages
        run: npx wrangler@4 pages deploy apps/web/build/client --project-name=delphic-dashboard --branch=${{ github.ref_name }}
