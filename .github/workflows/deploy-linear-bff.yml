name: Deploy Linear BFF (Worker)

on:
  push:
    branches: [preview, main]
    paths:
      - "apps/bff/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-linear-bff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-linear-bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build types
        run: pnpm turbo run build --filter=@plane/types

      # Use wrangler from apps/bff (not workspace root). Token needs Workers Scripts Edit + User Memberships Read.
      - name: Deploy Worker
        working-directory: apps/bff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Sync Worker secrets
        working-directory: apps/bff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          LINEAR_WORKSPACE_ID: ${{ secrets.LINEAR_WORKSPACE_ID }}
        run: |
          printf '%s' "$LINEAR_API_KEY" | pnpm exec wrangler secret put LINEAR_API_KEY
          printf '%s' "$LINEAR_WEBHOOK_SECRET" | pnpm exec wrangler secret put LINEAR_WEBHOOK_SECRET
          if [ -n "$LINEAR_WORKSPACE_ID" ]; then
            printf '%s' "$LINEAR_WORKSPACE_ID" | pnpm exec wrangler secret put LINEAR_WORKSPACE_ID
          fi

      - name: Smoke test health
        run: curl -sfS "https://linear.delphic.studio/health" | head -c 500
        continue-on-error: true
