name: Deploy Linear BFF (Worker)

on:
  push:
    branches: [preview, main]
    paths:
      - "apps/bff/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-linear-bff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-linear-bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck BFF
        run: pnpm turbo run check:types --filter=bff --filter=@plane/types

      # API token needs: Workers Scripts Edit, Workers KV Storage Edit, Account Settings Read
      - name: Deploy Worker and sync secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/bff
          command: deploy
          secrets: |
            LINEAR_API_KEY
            LINEAR_WEBHOOK_SECRET
            LINEAR_WORKSPACE_ID
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          LINEAR_WORKSPACE_ID: ${{ secrets.LINEAR_WORKSPACE_ID }}

      - name: Smoke test health
        run: curl -sfS "https://linear.delphic.studio/health" | head -c 500
        continue-on-error: true
